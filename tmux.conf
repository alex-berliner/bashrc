# ~/.config/tmux/tmux.conf

# --- General ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on                       # copies go to system clipboard via OSC-52
set -g base-index 1                          # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on                   # renumber when a window closes
set -sg escape-time 10                       # snappier ESC in vim
set -g focus-events on

# --- Prefix: Ctrl-a (instead of Ctrl-b) ---
set -g prefix C-a
bind C-a send-prefix

# --- Reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# --- Splits (open in current directory) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind 6 split-window -h -c "#{pane_current_path}"
bind 7 split-window -v -c "#{pane_current_path}"

# --- Pane resizing (repeatable: hold prefix once, then tap) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Window switching ---
bind s next-window

# --- Modeless scrollback (auto-enter copy mode; -e auto-exits at bottom) ---
bind -n S-Up     copy-mode -e \; send -X scroll-up
bind -n S-PageUp copy-mode -e \; send -X page-up
bind -n S-Home   copy-mode -e \; send -X history-top
# once in copy mode, keep the same keys working (plus down/bottom to return)
bind -T copy-mode-vi S-Up       send -X scroll-up
bind -T copy-mode-vi S-Down     send -X scroll-down
bind -T copy-mode-vi S-PageUp   send -X page-up
bind -T copy-mode-vi S-PageDown send -X page-down
bind -T copy-mode-vi S-Home     send -X history-top
bind -T copy-mode-vi S-End      send -X history-bottom

# --- Copy mode (vi keys) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# y and mouse drag-release copy straight to the X11 system clipboard via xclip
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "xclip -selection clipboard -in"

# --- Status bar ---
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=green,bold]#S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=white]%I:%M %p "
setw -g window-status-current-style "fg=black,bg=green,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
